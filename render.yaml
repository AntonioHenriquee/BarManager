# Demonstração de um único estabelecimento. Autorize o Blueprint na sua conta Render.
services:
  - type: web
    name: meu-bar-teste
    runtime: docker
    plan: free
    region: oregon
    branch: feat/meu-bar-web
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meu-bar-teste-db
          property: connectionString
      - key: Bootstrap__AdminPassword
        generateValue: true
      - key: Database__Migrate
        value: "true"
      - key: Security__SecureCookies
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Node__Mode
        value: Authority
      - key: Node__DeviceId
        value: demonstracao-web
      - key: PORT
        value: "8080"
databases:
  - name: meu-bar-teste-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: meubar
    user: meubar
    ipAllowList: []
