server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /openapi/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location = /health { proxy_pass http://api:8080; }
 location = /index.html { add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; }
}
